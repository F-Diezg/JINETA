# The slow scripted threat of the generic scramble, with the radar on the pad but
# the Iris guided by the truth: the generic-scramble case A, to the last bit (the
# radar tracks the threat, nobody uses its track).
name: "A · slow, perfect"
detail: "8 m/s turning, guided by the truth"
duration: 120
environment: {atmosphere: sea_level}
sites:
  - {id: pad, position: [0, 0], alert_range: 400, radar: short_range}
interceptors:
  - {id: iris, vehicle: iris, site: pad, target: threat, speed: 16}
threats:
  - id: threat
    kind: turning
    position: [420, -250]
    altitude: 110
    speed: 8
    course_deg: 155
    turn_rate_deg_s: -1.5
