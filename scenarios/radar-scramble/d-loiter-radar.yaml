# Case C, the Iris guided by the radar's track: it chases the drone round its orbit
# for the whole run and never gets within the capture radius (no capture in five
# seeds; the onboard seeker of phase 9 step 6 is the answer).
name: "D · loiter, radar"
detail: "18 m/s orbit, guided by the radar"
duration: 150
environment: {atmosphere: isa}
sites:
  - {id: pad, position: [0, 0], alert_range: 400, radar: short_range}
interceptors:
  - {id: iris, vehicle: iris, site: pad, target: drone, speed: 25, knowledge: radar}
threats:
  - id: drone
    kind: fixed_wing
    vehicle: small_fixed_wing
    position: [650, -350]
    altitude: 100
    speed: 18
    course_deg: 140
    orbit: {center: [60, 40], radius: 150, clockwise: true}
