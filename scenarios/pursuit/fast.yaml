# Fast threat: the Iris is ordered to 30 m/s, more than it can fly. It nearly meets
# the threat head-on, misses, and falls behind. The margin of 50 m keeps the run
# going past the miss, so the plot shows it being left behind.
name: Fast threat
detail: "25 m/s, straight"
duration: 60
environment: {atmosphere: sea_level}
interceptors:
  - id: iris
    vehicle: iris
    start: {position: [0, 0], altitude: 100}
    target: threat
    speed: 30
    margin: 50
threats:
  - id: threat
    kind: straight
    position: [-300, -250]
    altitude: 120
    speed: 25
    course_deg: 45
