# A fast threat from the South-West, straight towards the North-East: it is past
# before the Iris gets up to it; the Iris misses and chases it until it leaves the
# dome.
name: "B · fast threat"
detail: "25 m/s, straight"
duration: 120
environment: {atmosphere: sea_level}
sites:
  - {id: pad, position: [0, 0], alert_range: 400}
interceptors:
  - {id: iris, vehicle: iris, site: pad, target: threat, speed: 30}
threats:
  - id: threat
    kind: straight
    position: [-600, -350]
    altitude: 120
    speed: 25
    course_deg: 40
