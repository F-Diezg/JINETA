# Three threats against two pads, one Iris for each. Each Iris launches when its
# own target comes within the alert range of its pad.
#   slow:  a scripted point, turning gently towards the north pad: caught.
#   drone: the fixed wing, loitering over the south pad: caught.
#   fast:  a scripted point crossing the south pad at 25 m/s: it escapes.
name: "A · three threats"
detail: "two pads, one Iris for each threat"
duration: 120
environment: {atmosphere: isa}
sites:
  - {id: north-pad, position: [400, 0], alert_range: 400}
  - {id: south-pad, position: [-400, 0], alert_range: 400}
interceptors:
  - {id: iris-n, vehicle: iris, site: north-pad, target: slow, speed: 16}
  - {id: iris-s1, vehicle: iris, site: south-pad, target: drone, speed: 25}
  - {id: iris-s2, vehicle: iris, site: south-pad, target: fast, speed: 30}
threats:
  - id: slow
    kind: turning
    position: [1000, -250]
    altitude: 110
    speed: 8
    course_deg: 170
    turn_rate_deg_s: -1
  - id: drone
    kind: fixed_wing
    vehicle: small_fixed_wing
    position: [-900, 450]
    altitude: 100
    speed: 18
    course_deg: 300
    orbit: {center: [-380, 60], radius: 150, clockwise: true}
  - id: fast
    kind: straight
    position: [-1000, -650]
    altitude: 120
    speed: 25
    course_deg: 40
